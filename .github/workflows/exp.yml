name: voice experiment
on:
  push:
    branches: [ci-exp]
permissions:
  contents: write
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q onnxruntime==1.32.0 numpy soundfile scipy
      - run: python exp.py > run.log 2>&1 || true
      - name: report
        if: always()
        run: |
          mkdir -p rep && cp -r outputs run.log rep/ 2>/dev/null || true
          cd rep && git init -q && git config user.name HRadhi4 && git config user.email HRadhi4@users.noreply.github.com
          git checkout -q -b ci-exp-results && git add -A && git commit -q -m "experiment results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-exp-results
